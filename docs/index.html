<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>misc-html</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #191c24;
    --border: #2b303b;
    --text: #e6e8ee;
    --muted: #9aa2b1;
    --accent: #6ea8fe;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6fa;
      --card: #ffffff;
      --border: #e2e6ee;
      --text: #1b1f27;
      --muted: #667085;
      --accent: #2563eb;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 48px 20px 64px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.02em; }
  header p { color: var(--muted); margin: 0; font-size: 14px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin: 0 0 12px; }
  a.item {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s ease, transform 0.05s ease;
  }
  a.item:hover { border-color: var(--accent); }
  a.item:active { transform: translateY(1px); }
  .item .title { font-size: 16px; font-weight: 600; }
  .item .desc { color: var(--muted); font-size: 13px; margin-top: 3px; }
  footer { margin-top: 40px; color: var(--muted); font-size: 12px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>misc-html</h1>
    <p>雑多な静的 HTML 置き場</p>
  </header>

  <ul>
    <li>
      <a class="item" href="design-sample/">
        <div class="title">TRPGカタログ デザインサンプル</div>
        <div class="desc">シナリオ一覧と入力フォームのデザイン7案</div>
      </a>
    </li>
    <li>
      <a class="item" href="terminal-tools-cheatsheet.html">
        <div class="title">Terminal Tools チートシート</div>
        <div class="desc">cmux / herdr / lazygit のキーボードショートカット早見表</div>
      </a>
    </li>
  </ul>

  <footer>
    <a href="https://github.com/karia/misc-html">GitHub リポジトリ</a>
  </footer>
</div>
</body>
</html>
